<!doctype html>
<html lang="ko">

    <meta name="description" content="MoreHabit(모어해빗) - 천천히, 하지만 확실하게. 나만의 습관 & 뽀모도로 매니저" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <body class="bg-[#f4f7fc] text-[#0f172a] antialiased selection:bg-[#dbeafe] selection:text-[#1e40af]">
    <div id="root">
      <!-- React 로드 전 정적 스플래시: SplashScreen.tsx 와 동일한 마크업이라 이어서 한 화면으로 보임 -->
      <div style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#ffffff;">
        <img src="/src/assets/mobit/default.webp" alt="" width="128" height="150" style="width:128px;height:150px;object-fit:contain;" />
        <span style="font-family:'Pretendard',system-ui,sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.02em;color:#1d4ed8;">MoreHabit</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
